name: Browser runtime
on:
  push:
    branches: [feat/browser-runtime, main]
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: npm test
      - run: cargo test --locked --manifest-path browser-core/Cargo.toml --release
      - run: npm run build
      - run: npm run test:wasm
      - name: Browser smoke test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.65.1
          npx playwright install --with-deps chromium
      - run: node scripts/test-browser.mjs
      - run: node scripts/test-global-browser.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: browser-app
          path: dist/
