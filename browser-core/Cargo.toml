[package]
name = "mini-bitcoin-browser"
version = "0.2.0"
edition = "2024"

# Separate workspace: the browser build never pulls native TCP/TUI dependencies.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa", "alloc"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
